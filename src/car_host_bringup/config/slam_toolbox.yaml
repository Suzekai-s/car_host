slam_toolbox:
  ros__parameters:
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_link"
    scan_topic: "/scan"
    mode: "mapping"
    solver_plugin: "ceres_scan_matching"
    ceres_linear_solver: "SPARSE_NORMAL_CHOLESKY"
    ceres_huber_width: 0.05
    ceres_max_num_iterations: 10
    map_update_interval: 1.0
    max_laser_range: 12.0
    minimum_time_interval: 0.25
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    use_scan_matching: true
    minimum_scan_quality: 0.5
    do_loop_closure: true
    loop_match_min_chain_size: 10
    loop_match_max_variance_coarse: 3.0
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    resolution: 0.05
